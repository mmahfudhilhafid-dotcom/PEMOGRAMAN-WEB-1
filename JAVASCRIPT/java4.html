<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Fungsi nilai akhir</title>
</head>
<body>
  <h1>Hitung nilai akhir</h1>

  <script>
    function hitungNilaiAkhir(tugas, ujian) {
      return tugas * 0.4 + ujian * 0.6;
    }
  </script>

  <button type="button"
          onclick="alert(hitungNilaiAkhir(prompt('Nilai tugas Rani:'), prompt('Nilai ujian Rani:')))">
    Hitung nilai Rani
  </button>
</body>
</html>
