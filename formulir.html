<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <table width="30%">
            <tr>
                <td>Username</td>
                <td><input type="text" name="havid" id="" placeholder="username" required></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="12345678" id="" placeholder="password" required></td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td><input type="radio" name="kelamin" id="" checked>Laki laki
                    <input type="radio" name="kelamin" id="">Perempuan
                </td>
            </tr>
            <tr>
                <td>Alamat</td>
                <td><textarea name="alamat" id="" rows="5" cols="" required></textarea></td>
            </tr>
            <tr>
                <td>Jurusan</td>
                <td><select name="jurusan" id="" required>
                    <optgroup label="FTD">
                        <option value="TI">Teknik Informatika</option>
                        <option value="SK">Sistem Komputer</option>
                        <option value="DKV">Desain Komunikasi Visual</option>
                    </optgroup>
                    <optgroup label="FEB">
                        <option value="AK">Akuntansi</option>
                        <option value="MAJ">Manajemen</option>
                    </optgroup>
                </select></td>
            </tr>
            <tr>
                <td>Umur</td>
                <td><input type="number" name="umur" id="" min="17" max="100" required></td>
            </tr>
            <tr>
                <td>Tanggal Lahir</td>
                <td><input type="date" name="tanggal" id="" required></td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Kirim" name="Kirim">
                <input type="button" value="Batal" name="batal">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
